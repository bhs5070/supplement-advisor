name: ad-fact-check
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_dev
      POSTGRES_DB: advisor
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: [{path: .env, required: false}]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://advisor:advisor_dev@db:5432/advisor
      REDIS_URL: redis://redis:6379/0
      RAW_STORAGE_DIR: /data/raw
    command: ["sh", "-c", "alembic upgrade head && python scripts/setup_checkpoints.py"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: [{path: .env, required: false}]
    environment: *backend_env
    command: ["uvicorn", "supplement_advisor.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: .
    env_file: [{path: .env, required: false}]
    environment: *backend_env
    command: ["celery", "-A", "supplement_advisor.celery_app:celery_app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    volumes: ["raw_files:/data/raw"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    build: .
    env_file: [{path: .env, required: false}]
    environment: *backend_env
    command: ["celery", "-A", "supplement_advisor.celery_app:celery_app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  raw_files:

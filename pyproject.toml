[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "supplement-advisor"
version = "0.1.0"
description = "Evidence-aware supplement collection reports (M1)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6", "httpx>=0.28,<0.29", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "openai>=2,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL, Redis and/or Celery"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/supplement_advisor"]
